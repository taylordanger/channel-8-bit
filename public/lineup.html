<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cast Lineup</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #0b0814; color: #e9e4ff; font-family: "Press Start 2P", monospace; padding: 16px; }

    <header><span>CAST LINEUP · <span id="emotion"></span></span><a href="/">← back to the broadcast</a></header>
