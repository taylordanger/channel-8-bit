<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Channel 8-Bit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0b0814;
        --panel: #15102a;
        --text: #e9e4ff;
        --muted: #8a82b0;
        --accent: #ff3355;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Press Start 2P", monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 16px;
      }
      .tv-wrap {
        position: relative;
        width: min(100%, 1280px);
        aspect-ratio: 16 / 9;
        border: 6px solid #2a2140;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 0 60px #6c2dc744;
      }
      canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
      #tunein {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; gap: 18px;
        align-items: center; justify-content: center;
        background: #000000b0; cursor: pointer; font-size: clamp(10px, 2vw, 18px);
      }
      #tunein .btn { background: var(--accent); padding: 14px 20px; border-radius: 4px; }
      #tunein small { color: var(--muted); font-size: 0.6em; }
      .below {
        width: min(100%, 1280px);
        margin-top: 16px;
        background: var(--panel);
        border-radius: 8px;
        padding: 14px 16px;
      }
      h2 { font-size: 11px; color: var(--muted); margin: 0 0 10px; }
      #guide { list-style: none; margin: 0; padding: 0; font-size: 10px; line-height: 2.2; }
      #guide li { display: flex; gap: 14px; }
      #guide .time { color: var(--muted); min-width: 80px; }
      #guide li.now { color: #ffe066; }
    </style>
  </head>
  <body>
    <div class="tv-wrap">
      <canvas id="tv"></canvas>
      <div id="tunein">
        <div class="btn">▶ TUNE IN</div>
        <small>sound on · everyone sees the same broadcast</small>
      </div>
    </div>
    <section class="below">
      <h2>PROGRAM GUIDE</h2>
      <ol id="guide"></ol>
    </section>
    <script type="module" src="/app.js"></script>
  </body>
</html>
